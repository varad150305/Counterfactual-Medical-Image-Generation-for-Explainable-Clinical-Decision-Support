# Experiment B — PRISM + disease consistency:  L = L_diffusion + lambda1 * L_disease
# Everything else (data, recipe, steps, lr, seed, editing settings) is inherited from baseline.yaml, so A and B
# differ ONLY in this loss block (tests/test_phase6_disease.py::test_a_and_b_configs_differ_only_in_the_loss_block).
#
# lambda1 (weight) is null until the pre-registered rule is applied to the Phase 6 smoke run:
#   lambda1 = round_1_sig( mean L_diffusion / mean L_disease over the first 10 steps at initialisation )
# (docs/PHASE_6_DISEASE_CONSISTENCY.md). assert_runnable refuses to run B while the weight is null.
extends: baseline.yaml

experiment:
  id: B
  name: B_prism_plus_disease

losses:
  disease_consistency: {enabled: true, weight: null}   # lambda1

# Frozen independent classifier used by L_disease: the Phase 5b real-data DenseNet121 (best.pt). Loading refuses a hash mismatch.
# classifier_checkpoint is filled in by scripts/make_phase6_inputs.py (the file is a Kaggle input, not in the repo).
classifier_checkpoint: null
classifier_sha256: d14a9e87519e80803449cdeb2cf550a08b4508f52587d3767aa967f8cb51763a
